# Sema seed request for the experiments consumer (gwexp.sema snapshot).
# The experiment words, glitch (scada glitch messages decoded from the
# journal DB by the pico reproducers), plus the thermistor-reader
# lineage the ads-noise harness decodes from box layouts (000-003; the
# fleet's 000 records decode typed — no fallback needed), the house
# alert words the alerter witnesses decode, and gw.opsgenie.alert, the
# notifier's record of each alert read back from Opsgenie, and the scada
# boot and hourly messages the beech store-heat analysis decodes
# (report.event 002, heating.forecast 000). Formats and enums arrive via
# dependencies.

initial_targets:
  types:
    glitch: {}
    snapshot.spaceheat: {}
    gw.adc.waveform: {}
    gw.channel.gap.stats: {}
    gw.experiment.run:
      versions: ["000", "001"]
    gw.channel.jump.stats: {}
    gw.channel.noise.stats: {}
    gw.readings: {}
    i2c.thermistor.reader.component.gt: {}
    report.event:
      versions: ["002", "003", "004"]
    heating.forecast:
      versions: ["000"]
    layout.lite:
      versions: ["004", "005", "006", "007", "008", "009", "010", "011", "012", "013"]
    gw.alert:
      versions: ["000"]
    gw.opsgenie.alert:
      versions: ["000"]
