    versions:
      "001":
        schema_url: "https://schemas.electricity.works/enums/spaceheat.unit/001"
        created: "2024-09-02T15:00:00Z"
        status: "published"

  temp.calc.method:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Method used to calculate temperature from thermistor voltage measurements."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/temp.calc.method/000"
        created: "2024-10-21T23:19:00Z"
        status: "published"

types:
  gw.channel.jump.stats:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Jump/spike statistics for one fleet telemetry channel over one archive window, in the channel's own serialized units — the element of the canary view of board electrical health."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.channel.jump.stats/000"
        created: "2026-08-06T19:40:00Z"
        status: "staging"
        summary: "Initial version, from the semafy-experiments pilot (ads-noise at spruce). Travels with the channel's own sema object (ChannelTypeName/ChannelVersion); values in the channel's serialized units."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "non.negative.int"
            - "positive.float"
            - "positive.int"
            - "spaceheat.name"
            - "utc.milliseconds"

  gw.experiment.run:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The metadata every experiment result carries: kind slug, host GNode alias, wall-clock measurement window, optional code pointer."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/gw.experiment.run/000"
        created: "2026-08-06T19:40:00Z"
        status: "staging"
        summary: "Initial version, from the semafy-experiments pilot (ads-noise at spruce)."
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "non.empty.string"
            - "spaceheat.name"
            - "utc.milliseconds"

  i2c.thermistor.channel.config:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Per-channel configuration for a thermistor input read through an I2C ADC."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/i2c.thermistor.channel.config/002"
        created: "2026-06-26T03:40:00Z"
        status: "staging"
        summary: "- Unit: drop (redundant; unit and scaling are carried by channel identity) - Exponent: drop (redundant; unit and scaling are carried by channel identity) - CapturePeriodS / AsyncCapture / AsyncCaptureDelta / PollPeriodMs: drop (capture/report tuning moved to operational-params capture.tuning) - SendToDerived: drop (derived routing is computed from DerivedChannel InputChannelNames)"
        direct_dependencies:
          structural:
            - "i2c.adc.channel:000"
            - "positive.int"
            - "spaceheat.name"
      "001":
        schema_url: "https://schemas.electricity.works/types/i2c.thermistor.channel.config/001"
        created: "2026-03-30T16:07:00Z"
        status: "staging"
        summary: "Initial Sema version. Starts at 001 to match the only version ever emitted in the field; the never-emitted sema 000 was dropped."
        direct_dependencies:
          structural:
            - "i2c.adc.channel:000"
            - "positive.int"
            - "spaceheat.name"
            - "spaceheat.unit:001"

  i2c.thermistor.reader.component.gt:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Configuration for an I2C thermistor reader component that samples one board-resident ADC (named by AdcName against the board record) and publishes one or more thermistor-backed temperature channels."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/003"
        created: "2026-07-19T18:55:00Z"
        status: "staging"
        summary: "- Bus, AdcAddress, AdcReferenceVolts, SeriesResistanceKOhms dropped (facts on the board's thermistor-interface capability entry); AdcName added, naming that entry in the board record's ThermistorAdcs; DeviceType dropped (TypeName is the kind; board identity lives on the board component); BoardComponentId added, anchoring the reader to its scada.board.component.gt. Context-dependent: AdcName and BoardComponentId are derived from the source layout, which the standalone component does not carry."
        direct_dependencies:
          structural:
            - "i2c.thermistor.channel.config:002"
            - "pascal.case"
            - "temp.calc.method:000"
            - "uuid4.str"
      "002":
        schema_url: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/002"
        created: "2026-06-26T03:40:00Z"
        status: "staging"
        summary: "- ComponentAttributeClassId (cac UUID) -> DeviceType (gw1.device.type value, pascal.case). Context-dependent: the device type lived on the referenced cac, not the component."
        direct_dependencies:
          structural:
            - "i2c.thermistor.channel.config:002"
            - "pascal.case"
            - "positive.float"
            - "spaceheat.name"
            - "temp.calc.method:000"
            - "uuid4.str"
      "001":
        schema_url: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/001"
        created: "2026-03-30T16:07:00Z"
        status: "staging"
        summary: "Initial Sema version. Starts at 001 to match the only field-emitted version; the never-emitted sema 000 was dropped. Structural-only (gwsproto ConfigUniqueness/AddressValidity axioms deferred)."
        direct_dependencies:
          structural:
            - "i2c.thermistor.channel.config:001"
            - "positive.float"
            - "spaceheat.name"
            - "temp.calc.method:000"
            - "uuid4.str"
