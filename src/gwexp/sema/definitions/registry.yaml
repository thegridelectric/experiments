  i2c.thermistor.reader.component.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Configuration for an I2C thermistor reader component that samples one board-resident ADC (named by AdcName against the board record) and publishes one or more thermistor-backed temperature channels."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/i2c.thermistor.reader.component.gt/000"
        created: "2026-08-10T20:40:00Z"
        status: "staging"
        summary: "Initial Sema version. ComponentAttributeClassId (cac UUID) -> DeviceType (gw1.device.type value, pascal.case) -> dropped (TypeName is the kind; board identity lives on the board component). Bus, AdcAddress, AdcReferenceVolts, SeriesResistanceKOhms dropped (facts on the board's thermistor-interface capability entry); AdcName added, naming that entry in the board record's ThermistorAdcs; DataRateSps added (the per-conversion data rate the reader writes in the ADC config word — a member of the board ADC's SupportedDataRatesSps); BoardComponentId added, anchoring the reader to its scada.board.component.gt. Context-dependent: AdcName and BoardComponentId are derived from the source layout, which the standalone component does not carry."
        direct_dependencies:
          structural:
            - "i2c.thermistor.channel.config:000"
            - "pascal.case"
            - "positive.int"
            - "temp.calc.method:000"
            - "uuid4.str"

