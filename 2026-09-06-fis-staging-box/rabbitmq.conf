# Staging broker (the hw1__2 box) RabbitMQ conf — RabbitMQ 4.1.
#
# The prod conf (../rmqbot/rmq-docker/config/rabbitmq.conf) with the two
# things a staging box carries from day one: TLS-only listeners with the
# ssl_options tightening (every client presents a cert — prod's notch 3),
# and the hw1__2 vhost. The FIS gate itself is NOT here: it is the rmqbot
# fragment compose.gate.yaml mounts into conf.d. This file is copied over
# rmq-docker/config/rabbitmq.conf on the box (recipe in this README).
#
# No credentials live in this file or in git; users are runtime-created
# after boot from the box's .env (rmqbot/rmq-docker/README.md).

## Networking — TLS only. No plaintext listener: every principal on this
## broker is cert-plus-claims, and a password user would outrank the cert
## on MQTT (fis-gate.conf).
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile           = /etc/rabbitmq/rmq-cacert.crt
ssl_options.certfile             = /etc/rabbitmq/rmq-cert.crt
ssl_options.keyfile              = /etc/rabbitmq/rmq-key.pem
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true

loopback_users = none

## Topology — generated, never hand-edited. The mounted definitions file is
## gwbase's renderer run for THIS vhost (gen_definitions.py --vhost hw1__2),
## placed on the box by the recipe; never committed.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

cluster_partition_handling = ignore

## Management — plain on loopback for FIS's supersession kill (the
## container publishes 15672 to the host; the cloud firewall closes it),
## TLS on 15671 for people.
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.ssl.port       = 15671
management.ssl.cacertfile = /etc/rabbitmq/rmq-cacert.crt
management.ssl.certfile   = /etc/rabbitmq/rmq-cert.crt
management.ssl.keyfile    = /etc/rabbitmq/rmq-key.pem
management.ssl.honor_cipher_order   = true
management.ssl.honor_ecc_order      = true
management.ssl.client_renegotiation = false
management.ssl.secure_renegotiate   = true

log.console = true
log.console.level = info

## MQTT — TLS only; identity from the client cert (fis-gate.conf).
mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
mqtt.allow_anonymous  = false
mqtt.vhost            = hw1__2
mqtt.exchange         = amq.topic
mqtt.max_session_expiry_interval_seconds = 86400
mqtt.prefetch         = 10
