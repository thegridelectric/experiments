# Harness broker conf: what a box's own rabbitmq.conf carries — listeners,
# definitions — with the TLS block (material + the ssl_options tightening a
# staging box has from day one, prod's notch 3) in advanced.config beside it. The gate itself is NOT here: it is the
# rmqbot fragment mounted into conf.d by docker-compose.yml.
listeners.tcp = none
listeners.ssl.default = 5671

# ssl_options (TLS material, verify_peer, the CRL check) live WHOLE in
# advanced.config: the CRL cache option has no conf-schema key, and an
# ssl_options list in advanced.config replaces this file's ssl_options.*
# keys rather than merging with them (witnessed on 4.1.8: a crl_cache-only
# advanced.config left the listeners with no cert). One home or the other,
# never split.

loopback_users = none

# gwbase's generated dev definitions: vhost d1__1, smqPublic (administrator),
# the per-class exchange pairs.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

log.console = true
log.console.level = info

# MQTT over TLS only; identity from the client cert (gate fragment).
mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
mqtt.allow_anonymous = false
mqtt.vhost    = d1__1
mqtt.exchange = amq.topic
