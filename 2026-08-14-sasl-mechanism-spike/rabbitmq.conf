# Spike broker conf: TLS-only AMQP, client certs REQUIRED, GRIDWORKS as the
# only SASL mechanism, all auth delegated to the stub FIS over HTTP.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile   = /certs/server.pem
ssl_options.keyfile    = /certs/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

auth_mechanisms.1 = GRIDWORKS
# bare CN (the GNodeId), not the full DN, as the username
ssl_cert_login_from = common_name

auth_backends.1 = http
auth_http.http_method   = post
auth_http.user_path     = http://stub-fis:8080/auth/user
auth_http.vhost_path    = http://stub-fis:8080/auth/vhost
auth_http.resource_path = http://stub-fis:8080/auth/resource
auth_http.topic_path    = http://stub-fis:8080/auth/topic
