    - name: web
      image: localhost/beech-sim_frontend:latest
      ports:
        - containerPort: 5173
          hostPort: 5173
          protocol: TCP
      volumeMounts:
        - name: house
          mountPath: /house
          readOnly: true
        - name: house-buffer
          mountPath: /house-buffer
          readOnly: true
      command: ["sh", "-c"]
      args:
        - |
          VITE_HOUSE_WEATHER_BUNDLES="$(node -e '
          const fs = require("fs");
          const bundles = {};
          for (const dir of ["/house", "/house-buffer"]) {
            const layout = JSON.parse(fs.readFileSync(dir + "/hardware-layout.json", "utf8"));
            const params = JSON.parse(fs.readFileSync(dir + "/operational-params.json", "utf8"));
            const house = layout.GNodes.find(
              (gNode) => gNode.GNodeClass === "LeafTransactiveNode"
            ).Alias;
            bundles[house] = params.WeatherBundleName;
          }
          process.stdout.write(JSON.stringify(bundles));
          ')" || exit 1
          export VITE_HOUSE_WEATHER_BUNDLES
          node -e '
          const net = require("net");
          const deadline = Date.now() + 180000;
          function probe() {
            const socket = net.connect(8000, "127.0.0.1");
            socket.on("connect", () => { socket.end(); process.exit(0); });
            socket.on("error", () => {
              socket.destroy();
              if (Date.now() > deadline) process.exit(1);
              setTimeout(probe, 1000);
            });
          }
          probe();
          '
          exec npx vite --host 0.0.0.0 --port 5173 --strictPort
