[project]
name = "gridworks-experiments"
version = "0.1.0"
description = "GridWorks real-condition experiments: harnesses, captured data, findings, and sema-typed results."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.118",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pika>=1.4.4",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwexp"]

[tool.pyright]
# The vendored sema snapshot and the top-level helper modules live
# outside the installed package path; make the IDE see them.
extraPaths = ["src", "."]
