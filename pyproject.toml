[project]
name = "gridworks-experiments"
version = "0.1.0"
description = "GridWorks real-condition experiments: harnesses, captured data, findings, and sema-typed results."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwexp"]
